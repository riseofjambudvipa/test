name: CapStudio Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag Name (e.g., v0.0.1)'
        required: false
        type: string
        default: 'v0.0.1'
      release_title:
        description: 'Release Title'
        required: false
        type: string
        default: 'CapStudio v0.0.1'
      run_tests:
        description: 'Run Analyze & Tests before building'
        required: true
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows Desktop (.zip)'
        required: true
        type: boolean
        default: true
      build_android:
        description: 'Build Android (APK & AAB)'
        required: true
        type: boolean
        default: true
      build_web:
        description: 'Build Web App (.zip)'
        required: true
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS App (.dmg)'
        required: true
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux Packages (.deb, .tar.gz, .AppImage)'
        required: true
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS (Runner.app)'
        required: true
        type: boolean
        default: false
      build_whispers:
        description: 'Build Whisper CLI Binaries (Windows, macOS, Linux)'
        required: true
        type: boolean
        default: true
      whisper_tag:
        description: 'Whisper.cpp Git Tag / Version (e.g. v1.9.5)'
        required: false
        type: string
        default: 'v1.9.5'
      pack_ffmpeg:
        description: 'Package FFmpeg Binaries (Windows, macOS, Linux)'
        required: true
        type: boolean
        default: true
      pack_source_code:
        description: 'Pack Clean Source Code Archive (.zip)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # =========================================================================
  # 0. CODE QUALITY CHECKS
  # =========================================================================
  analyze_and_test:
    name: Analyze & Test
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # =========================================================================
  # 1. ANDROID (APK & AAB)
  # =========================================================================
  build_android:
    name: Build Android
    needs: [analyze_and_test]
    if: ${{ always() && !cancelled() && (needs.analyze_and_test.result == 'success' || needs.analyze_and_test.result == 'skipped') && inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/chromium-driver"
          sudo rm -rf "/usr/local/lib/node_modules"
          df -h

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Setup signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          echo "KEYSTORE_FILE=$PWD/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

      - run: flutter pub get

      - name: Build Android APK (Universal & Per-ABI Splits)
        run: |
          # 1. Build Universal FAT APK (runs on all architectures)
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CapStudio-Android-Universal.apk

          # 2. Build Per-ABI Architecture-specific APKs
          flutter build apk --release --split-per-abi
          [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] && mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/CapStudio-Android-arm64-v8a.apk
          [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] && mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/CapStudio-Android-armeabi-v7a.apk
          [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ] && mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/CapStudio-Android-x86_64.apk

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/CapStudio-Android.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/CapStudio-Android-*.apk
            build/app/outputs/bundle/release/CapStudio-Android.aab

  # =========================================================================
  # 2. WINDOWS DESKTOP
  # =========================================================================
  build_windows:
    name: Build Windows
    needs: [analyze_and_test]
    if: ${{ always() && !cancelled() && (needs.analyze_and_test.result == 'success' || needs.analyze_and_test.result == 'skipped') && inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: Exclude mobile-only FFmpegKit from Windows Desktop
        shell: pwsh
        run: |
          $roots = @($env:PUB_CACHE, "$env:LOCALAPPDATA\Pub\Cache", "$env:USERPROFILE\.pub-cache") | Where-Object { $_ -and (Test-Path $_) }
          foreach ($r in $roots) {
            Get-ChildItem -Path $r -Filter "pubspec.yaml" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*ffmpeg_kit_flutter_new-*" } | ForEach-Object {
              $c = Get-Content $_.FullName -Raw
              $c = $c -replace "(?ms)^      macos:.*?(?=^dependencies:)", "`r`n"
              Set-Content $_.FullName -Value $c -NoNewline
              Write-Host "Excluded desktop platforms from: $($_.FullName)"
            }
          }
          Remove-Item -Force ".flutter-plugins-dependencies" -ErrorAction SilentlyContinue
          flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle FFmpeg into Windows release
        shell: pwsh
        run: |
          $dist = "build/windows/x64/runner/Release"
          $tempDir = [System.IO.Path]::GetTempPath()
          $zip = Join-Path $tempDir "ffmpeg-essentials.zip"
          Write-Host "Downloading official GyanD Windows FFmpeg essentials 7.1..."
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $tempDir "ffmpeg_extracted") -Force
          $binFiles = Get-ChildItem -Path (Join-Path $tempDir "ffmpeg_extracted") -Recurse -Include "ffmpeg.exe", "ffprobe.exe"
          Copy-Item $binFiles.FullName -Destination $dist -Force
          Write-Host "Successfully bundled FFmpeg and ffprobe into Windows release bundle"

      - name: Package Windows Portable ZIP, MSIX (UWP), and Setup Installer (.exe)
        shell: pwsh
        run: |
          # 1. Portable ZIP
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/runner/CapStudio-Windows-x64.zip -Force
          Write-Host "Built CapStudio-Windows-x64.zip"

          # 2. Windows UWP / MSIX App Package
          # A fresh self-signed cert is generated each CI run (PFX is gitignored as a secret).
          # To install the resulting MSIX locally, run third_party/scripts/install_msix_cert.ps1 first.
          $env:CAPSTUDIO_CERT_PASSWORD = "capstudio-release-cert"
          .\third_party\scripts\certificate\windows\create_cert.ps1
          dart run msix:create --build-windows false --certificate-password $env:CAPSTUDIO_CERT_PASSWORD --install-certificate false --output-path build/windows/x64/runner --output-name CapStudio-Windows-x64
          Write-Host "Built CapStudio-Windows-x64.msix"

          # 3. Windows Inno Setup Installer (.exe)
          iscc "/Obuild\windows\x64\runner" "/FCapStudio-Setup-Windows-x64" "third_party\scripts\capstudio_setup.iss"
          Write-Host "Built CapStudio-Setup-Windows-x64.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/windows/x64/runner/CapStudio-Windows-x64.zip
            build/windows/x64/runner/CapStudio-Windows-x64.msix
            build/windows/x64/runner/CapStudio-Setup-Windows-x64.exe

  # =========================================================================
  # 3. WEB APPLICATION
  # =========================================================================
  build_web:
    name: Build Web
    needs: [analyze_and_test]
    if: ${{ always() && !cancelled() && (needs.analyze_and_test.result == 'success' || needs.analyze_and_test.result == 'skipped') && inputs.build_web }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run

      - name: Compress Web Distribution
        run: |
          cd build/web && zip -r ../../CapStudio-Web.zip . && cd ../..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: CapStudio-Web.zip

  # =========================================================================
  # 4. MACOS APP
  # =========================================================================
  build_macos:
    name: Build macOS
    needs: [analyze_and_test]
    if: ${{ always() && !cancelled() && (needs.analyze_and_test.result == 'success' || needs.analyze_and_test.result == 'skipped') && inputs.build_macos }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get

      - name: Exclude mobile-only FFmpegKit from macOS Desktop
        run: |
          echo "COPYFILE_DISABLE=1" >> $GITHUB_ENV
          echo "COPY_EXTENDED_ATTRIBUTES_DISABLE=1" >> $GITHUB_ENV
          export COPYFILE_DISABLE=1
          export COPY_EXTENDED_ATTRIBUTES_DISABLE=1

          for p in $(find ~/.pub-cache -path "*/ffmpeg_kit_flutter_new-*/pubspec.yaml" 2>/dev/null); do
            python3 -c '
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          s = re.sub(r"(?ms)^      macos:.*?(?=^dependencies:)", "\n", s)
          open(p, "w").write(s)
          print("Excluded desktop platforms from", p)
          ' "$p"
          done
          rm -f .flutter-plugins-dependencies
          flutter pub get
          find -L ~/.pub-cache macos -name '._*' -delete 2>/dev/null || true
          xattr -crs ~/.pub-cache macos 2>/dev/null || true

      - name: Build macOS
        run: flutter build macos --release

      - name: Bundle FFmpeg into macOS app
        run: |
          set -e
          curl -fsSL -o /tmp/ffmpeg-7.1.zip https://evermeet.cx/ffmpeg/ffmpeg-7.1.zip
          echo "5a1303c7babaffff3c32c141ff49c7f44bd3b3b3e7dcea992fd7d04b6558ef43  /tmp/ffmpeg-7.1.zip" | shasum -a 256 -c -
          mkdir -p /tmp/ffmpeg-mac && cd /tmp/ffmpeg-mac && unzip -q /tmp/ffmpeg-7.1.zip
          RES_DIR="$GITHUB_WORKSPACE/build/macos/Build/Products/Release/CapStudio.app/Contents/Resources"
          mkdir -p "$RES_DIR/bin"
          cp /tmp/ffmpeg-mac/ffmpeg "$RES_DIR/bin/ffmpeg"
          chmod +x "$RES_DIR/bin/ffmpeg"
          echo "Bundled FFmpeg 7.1 into CapStudio.app/Contents/Resources/bin/"

      - name: Ad-hoc CodeSign app bundle
        run: |
          APP="build/macos/Build/Products/Release/CapStudio.app"
          if [ -d "$APP" ]; then
            echo "Cleaning extended attributes and stale framework signatures..."
            dot_clean -m "$APP" 2>/dev/null || true
            find -L "$APP" -name "._*" -delete 2>/dev/null || true
            find "$APP/Contents/Frameworks" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
            xattr -crs "$APP" 2>/dev/null || true
            echo "Applying ad-hoc code signature..."
            codesign --force --deep --sign - "$APP"
          fi

      - name: Package macOS DMG
        run: |
          hdiutil create -format UDZO -srcfolder build/macos/Build/Products/Release/CapStudio.app build/macos/Build/Products/Release/CapStudio-macOS-Universal.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/CapStudio-macOS-Universal.dmg

  # =========================================================================
  # 5. LINUX PACKAGES (.deb, .tar.gz, .AppImage)
  # =========================================================================
  build_linux:
    name: Build Linux
    needs: [analyze_and_test]
    if: ${{ always() && !cancelled() && (needs.analyze_and_test.result == 'success' || needs.analyze_and_test.result == 'skipped') && inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgl1-mesa-dev libgles2-mesa-dev libmpv-dev \
            libvlc-dev vlc-bin libasound2-dev libpulse-dev \
            libjson-glib-dev file desktop-file-utils

      - run: flutter pub get

      - name: Exclude mobile-only FFmpegKit from Linux Desktop
        run: |
          for p in $(find ~/.pub-cache -path "*/ffmpeg_kit_flutter_new-*/pubspec.yaml" 2>/dev/null); do
            python3 -c '
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          s = re.sub(r"(?ms)^      macos:.*?(?=^dependencies:)", "\n", s)
          open(p, "w").write(s)
          print("Excluded desktop platforms from", p)
          ' "$p"
          done
          rm -f .flutter-plugins-dependencies
          flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Bundle FFmpeg into Linux bundle
        run: |
          set -e
          curl -fsSL -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          EXPECTED=$(curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz.md5 | awk '{print $1}')
          ACTUAL=$(md5sum /tmp/ffmpeg.tar.xz | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "FFmpeg checksum mismatch: expected $EXPECTED got $ACTUAL"
            exit 1
          fi
          mkdir -p /tmp/ffmpeg-linux && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-linux
          FFMPEG_BIN=$(find /tmp/ffmpeg-linux -name ffmpeg -type f | head -1)
          BUNDLE_BIN="$GITHUB_WORKSPACE/build/linux/x64/release/bundle/bin"
          mkdir -p "$BUNDLE_BIN"
          cp "$FFMPEG_BIN" "$BUNDLE_BIN/ffmpeg"
          chmod +x "$BUNDLE_BIN/ffmpeg"
          echo "Bundled static FFmpeg into bundle/bin/"

      - name: Build Debian Package (.deb)
        run: |
          chmod +x third_party/scripts/create_deb.sh
          ./third_party/scripts/create_deb.sh

      - name: Build Portable Tarball (.tar.gz) & Universal AppImage (.AppImage)
        run: |
          set -e
          BUNDLE_DIR="$GITHUB_WORKSPACE/build/linux/x64/release/bundle"
          if [ -f "$BUNDLE_DIR/CapStudio" ] && [ ! -f "$BUNDLE_DIR/capstudio" ]; then
            cp "$BUNDLE_DIR/CapStudio" "$BUNDLE_DIR/capstudio"
          fi
          chmod +x "$BUNDLE_DIR/CapStudio" "$BUNDLE_DIR/capstudio" 2>/dev/null || true

          # 1. Portable Linux x64 Tarball (works on Fedora, Arch, openSUSE, Ubuntu, etc.)
          tar -czf "CapStudio-Linux-x64.tar.gz" -C "$BUNDLE_DIR" .
          echo "Built CapStudio-Linux-x64.tar.gz"

          # 2. Universal Linux x86_64 AppImage
          APPDIR="/tmp/CapStudio.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE_DIR/." "$APPDIR/usr/bin/"
          if [ -f "assets/logo/logo.png" ]; then
            cp "assets/logo/logo.png" "$APPDIR/capstudio.png"
            cp "assets/logo/logo.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/capstudio.png"
          fi

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${HERE}/usr/bin/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          if [ -x "${HERE}/usr/bin/capstudio" ]; then
            exec "${HERE}/usr/bin/capstudio" "$@"
          else
            exec "${HERE}/usr/bin/CapStudio" "$@"
          fi
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/capstudio.desktop" << 'EOF'
          [Desktop Entry]
          Name=CapStudio
          GenericName=Caption Studio
          Comment=Free offline AI caption studio
          Exec=capstudio %U
          Icon=capstudio
          Type=Application
          Terminal=false
          Categories=AudioVideo;Video;
          EOF

          mkdir -p "$APPDIR/usr/share/applications"
          cp "$APPDIR/capstudio.desktop" "$APPDIR/usr/share/applications/capstudio.desktop"

          mkdir -p "$APPDIR/usr/share/metainfo"
          cat > "$APPDIR/usr/share/metainfo/com.capstudio.app.metainfo.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>com.capstudio.app</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>GPL-3.0-only</project_license>
            <name>CapStudio</name>
            <summary>Free offline AI caption studio</summary>
            <description>
              <p>CapStudio is an offline AI caption and subtitle studio powered by Whisper and FFmpeg.</p>
            </description>
            <launchable type="desktop-id">capstudio.desktop</launchable>
            <url type="homepage">https://github.com/riseofjambudvipa/test</url>
            <developer id="com.capstudio.ai">
              <name>CapStudio Team</name>
            </developer>
            <content_rating type="oars-1.1" />
            <provides>
              <binary>capstudio</binary>
            </provides>
          </component>
          EOF
          cp "$APPDIR/usr/share/metainfo/com.capstudio.app.metainfo.xml" "$APPDIR/usr/share/metainfo/capstudio.appdata.xml"

          curl -fsSL --retry 5 -o /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          ARCH=x86_64 NO_APPSTREAM=1 /tmp/appimagetool --appimage-extract-and-run "$APPDIR" "$GITHUB_WORKSPACE/CapStudio-Linux-x86_64.AppImage"
          chmod +x "$GITHUB_WORKSPACE/CapStudio-Linux-x86_64.AppImage"
          echo "Built CapStudio-Linux-x86_64.AppImage"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            capstudio_*.deb
            CapStudio-Linux-x64.tar.gz
            CapStudio-Linux-x86_64.AppImage

  # =========================================================================
  # 6. IOS RUNNER
  # =========================================================================
  build_ios:
    name: Build iOS
    needs: [analyze_and_test]
    if: ${{ always() && !cancelled() && (needs.analyze_and_test.result == 'success' || needs.analyze_and_test.result == 'skipped') && inputs.build_ios }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Build whisper.xcframework
        run: |
          chmod +x third_party/scripts/build/build_whisper_ios.sh
          ./third_party/scripts/build/build_whisper_ios.sh

      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install && cd ..

      - name: Build iOS (no-codesign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Runner as tar
        run: |
          tar -czf CapStudio-iOS-arm64.tar.gz -C build/ios/iphoneos Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: CapStudio-iOS-arm64.tar.gz

  # =========================================================================
  # 7. WHISPER CLI BINARIES (WINDOWS, MACOS, LINUX)
  # =========================================================================
  whisper_windows:
    name: Build Whisper CLI (Windows x64 & ARM64)
    if: ${{ inputs.build_whispers }}
    runs-on: windows-latest
    steps:
      - name: Checkout whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: 'ggml-org/whisper.cpp'
          ref: ${{ inputs.whisper_tag }}
          path: 'whisper_src'
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows AVX2 (Modern CPUs)
        shell: pwsh
        run: |
          cmake -S whisper_src -B build_avx `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_AVX2=ON `
            -DGGML_AVX=ON `
            -DGGML_FMA=ON `
            -DGGML_F16C=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build_avx --config Release --target whisper-cli || cmake --build build_avx --config Release --target main

          New-Item -ItemType Directory -Path dist/win_avx -Force | Out-Null
          $exe = Get-ChildItem -Path build_avx -Filter "whisper-cli.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path build_avx -Filter "main.exe" -Recurse | Select-Object -First 1
          }
          Copy-Item $exe.FullName dist/win_avx/whisper-cli.exe
          Copy-Item whisper_src/LICENSE dist/win_avx/whisper_LICENSE.txt

          Compress-Archive -Path dist/win_avx/* -DestinationPath dist/whisper-cli-win-x64-avx.zip -Force
          $hash = (Get-FileHash -Path dist/whisper-cli-win-x64-avx.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/whisper-cli-win-x64-avx.zip.sha256 -Value "$hash  whisper-cli-win-x64-avx.zip"

      - name: Build Windows Generic / No-AVX (Older CPUs)
        shell: pwsh
        run: |
          cmake -S whisper_src -B build_noavx `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_AVX2=OFF `
            -DGGML_AVX=OFF `
            -DGGML_FMA=OFF `
            -DGGML_F16C=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build_noavx --config Release --target whisper-cli || cmake --build build_noavx --config Release --target main

          New-Item -ItemType Directory -Path dist/win_noavx -Force | Out-Null
          $exe = Get-ChildItem -Path build_noavx -Filter "whisper-cli.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path build_noavx -Filter "main.exe" -Recurse | Select-Object -First 1
          }
          Copy-Item $exe.FullName dist/win_noavx/whisper-cli.exe
          Copy-Item whisper_src/LICENSE dist/win_noavx/whisper_LICENSE.txt

          Compress-Archive -Path dist/win_noavx/* -DestinationPath dist/whisper-cli-win-x64-noavx.zip -Force
          $hash = (Get-FileHash -Path dist/whisper-cli-win-x64-noavx.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/whisper-cli-win-x64-noavx.zip.sha256 -Value "$hash  whisper-cli-win-x64-noavx.zip"

      - name: Build Windows ARM64 (Snapdragon / Surface)
        shell: pwsh
        run: |
          cmake -S whisper_src -B build_win_arm64 `
            -A ARM64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_NATIVE=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build_win_arm64 --config Release --target whisper-cli || cmake --build build_win_arm64 --config Release --target main

          New-Item -ItemType Directory -Path dist/win_arm64 -Force | Out-Null
          $exe = Get-ChildItem -Path build_win_arm64 -Filter "whisper-cli.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path build_win_arm64 -Filter "main.exe" -Recurse | Select-Object -First 1
          }
          if ($exe) {
            Copy-Item $exe.FullName dist/win_arm64/whisper-cli.exe
          }
          Copy-Item whisper_src/LICENSE dist/win_arm64/whisper_LICENSE.txt

          Compress-Archive -Path dist/win_arm64/* -DestinationPath dist/whisper-cli-win-arm64.zip -Force
          $hash = (Get-FileHash -Path dist/whisper-cli-win-arm64.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/whisper-cli-win-arm64.zip.sha256 -Value "$hash  whisper-cli-win-arm64.zip"

      - name: Upload Windows Whisper Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-windows-artifacts
          path: |
            dist/*.zip
            dist/*.sha256

  whisper_macos:
    name: Build Whisper CLI (macOS Universal M1-M4 & Intel)
    if: ${{ inputs.build_whispers }}
    runs-on: macos-latest
    steps:
      - name: Checkout whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: 'ggml-org/whisper.cpp'
          ref: ${{ inputs.whisper_tag }}
          path: 'whisper_src'
          submodules: recursive

      - name: Build macOS Binary (Metal Accelerated Universal)
        run: |
          cmake -S whisper_src -B build_mac \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build_mac --config Release --target whisper-cli || cmake --build build_mac --config Release --target main

          mkdir -p dist/mac
          CLI_BIN=$(find build_mac \( -name "whisper-cli" -o -name "main" \) -type f | head -n 1)
          cp "$CLI_BIN" dist/mac/whisper-cli
          chmod +x dist/mac/whisper-cli
          cp whisper_src/LICENSE dist/mac/whisper_LICENSE.txt

          cd dist/mac
          zip -r ../whisper-cli-mac-universal.zip *
          cd ../..
          shasum -a 256 dist/whisper-cli-mac-universal.zip > dist/whisper-cli-mac-universal.zip.sha256

      - name: Upload macOS Whisper Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-macos-artifacts
          path: |
            dist/*.zip
            dist/*.sha256

  whisper_linux:
    name: Build Whisper CLI (Linux x64 & ARM64)
    if: ${{ inputs.build_whispers }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: 'ggml-org/whisper.cpp'
          ref: ${{ inputs.whisper_tag }}
          path: 'whisper_src'
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libsdl2-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Linux x64 Binary
        run: |
          cmake -S whisper_src -B build_linux_x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build_linux_x64 --config Release --target whisper-cli || cmake --build build_linux_x64 --config Release --target main

          mkdir -p dist/linux_x64
          CLI_BIN=$(find build_linux_x64 \( -name "whisper-cli" -o -name "main" \) -type f | head -n 1)
          cp "$CLI_BIN" dist/linux_x64/whisper-cli
          chmod +x dist/linux_x64/whisper-cli
          cp whisper_src/LICENSE dist/linux_x64/whisper_LICENSE.txt

          cd dist/linux_x64
          zip -r ../whisper-cli-linux-x64.zip *
          cd ../..
          sha256sum dist/whisper-cli-linux-x64.zip > dist/whisper-cli-linux-x64.zip.sha256

      - name: Build Linux ARM64 (aarch64) Binary
        run: |
          export SOURCE_DATE_EPOCH=1234567890
          cmake -S whisper_src -B build_linux_arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build_linux_arm64 --config Release --target whisper-cli || cmake --build build_linux_arm64 --config Release --target main

          mkdir -p dist/linux_arm64
          CLI_BIN=$(find build_linux_arm64 \( -name "whisper-cli" -o -name "main" \) -type f | head -n 1)
          cp "$CLI_BIN" dist/linux_arm64/whisper-cli
          chmod +x dist/linux_arm64/whisper-cli
          cp whisper_src/LICENSE dist/linux_arm64/whisper_LICENSE.txt

          cd dist/linux_arm64
          zip -r ../whisper-cli-linux-arm64.zip *
          cd ../..
          sha256sum dist/whisper-cli-linux-arm64.zip > dist/whisper-cli-linux-arm64.zip.sha256

      - name: Upload Linux Whisper Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-artifacts
          path: |
            dist/*.zip
            dist/*.sha256

  # =========================================================================
  # 8. FFMPEG BINARIES PACKAGING (WINDOWS, MACOS, LINUX)
  # =========================================================================
  pack_ffmpeg:
    name: Package FFmpeg Binaries (All Platforms & Architectures)
    if: ${{ inputs.pack_ffmpeg }}
    runs-on: ubuntu-latest
    steps:
      - name: Install Archive Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip p7zip-full xz-utils

      - name: Package Windows FFmpeg (GyanD Essentials)
        run: |
          mkdir -p ffmpeg_win/dist ffmpeg_win/extracted dist
          echo "Downloading official GyanD Windows FFmpeg essentials 7.1..."
          curl -fsSL --retry 5 --retry-connrefused -o ffmpeg_win/ffmpeg.zip "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          unzip -q ffmpeg_win/ffmpeg.zip -d ffmpeg_win/extracted
          find ffmpeg_win/extracted -name "ffmpeg.exe" -exec cp {} ffmpeg_win/dist/ \;
          find ffmpeg_win/extracted -name "ffprobe.exe" -exec cp {} ffmpeg_win/dist/ \;
          find ffmpeg_win/extracted -name "*.dll" -exec cp {} ffmpeg_win/dist/ \;
          find ffmpeg_win/extracted -name "LICENSE.txt" -exec cp {} ffmpeg_win/dist/ffmpeg_LICENSE.txt \;
          if [ ! -f ffmpeg_win/dist/ffmpeg_LICENSE.txt ]; then
            echo "FFmpeg is licensed under the LGPL/GPL. Official build by GyanD: https://www.gyan.dev/ffmpeg/" > ffmpeg_win/dist/ffmpeg_LICENSE.txt
          fi
          cd ffmpeg_win/dist
          zip -r ../../dist/ffmpeg-windows.zip ./*
          cd ../..
          sha256sum dist/ffmpeg-windows.zip > dist/ffmpeg-windows.zip.sha256

      - name: Package Windows ARM64 FFmpeg (BtbN GPL)
        run: |
          mkdir -p ffmpeg_win_arm64/dist ffmpeg_win_arm64/extracted dist
          echo "Packaging Windows ARM64 FFmpeg..."
          if curl -fsSL --retry 3 -o dist/ffmpeg-windows-arm64.zip "https://github.com/riseofjambudvipa/test/releases/download/test/ffmpeg-windows-arm64.zip"; then
            echo "Successfully retrieved ffmpeg-windows-arm64.zip from GitHub Release."
          else
            curl -fsSL --retry 5 --retry-connrefused -o ffmpeg_win_arm64/ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl.zip"
            unzip -q ffmpeg_win_arm64/ffmpeg.zip -d ffmpeg_win_arm64/extracted
            find ffmpeg_win_arm64/extracted -name "ffmpeg.exe" -exec cp {} ffmpeg_win_arm64/dist/ \;
            find ffmpeg_win_arm64/extracted -name "ffprobe.exe" -exec cp {} ffmpeg_win_arm64/dist/ \;
            find ffmpeg_win_arm64/extracted -name "*.dll" -exec cp {} ffmpeg_win_arm64/dist/ \;
            find ffmpeg_win_arm64/extracted -name "LICENSE*" -o -name "GPL*" -exec cp {} ffmpeg_win_arm64/dist/ffmpeg_LICENSE.txt \;
            if [ ! -f ffmpeg_win_arm64/dist/ffmpeg_LICENSE.txt ]; then
              echo "FFmpeg static build (GPL): https://github.com/BtbN/FFmpeg-Builds" > ffmpeg_win_arm64/dist/ffmpeg_LICENSE.txt
            fi
            cd ffmpeg_win_arm64/dist
            zip -r ../../dist/ffmpeg-windows-arm64.zip ./*
            cd ../..
          fi
          sha256sum dist/ffmpeg-windows-arm64.zip > dist/ffmpeg-windows-arm64.zip.sha256

      - name: Package macOS FFmpeg (Evermeet Universal/Static)
        run: |
          mkdir -p ffmpeg_mac/dist dist
          echo "Downloading official macOS FFmpeg 7.1..."
          curl -fsSL --retry 5 --retry-connrefused -o ffmpeg_mac/ffmpeg.zip "https://evermeet.cx/ffmpeg/ffmpeg-7.1.zip"
          curl -fsSL --retry 5 --retry-connrefused -o ffmpeg_mac/ffprobe.zip "https://evermeet.cx/ffmpeg/ffprobe-7.1.zip"
          unzip -q ffmpeg_mac/ffmpeg.zip -d ffmpeg_mac/dist
          unzip -q ffmpeg_mac/ffprobe.zip -d ffmpeg_mac/dist
          echo "FFmpeg is licensed under the LGPL 2.1+ / GPL 3.0+. Official binaries: https://evermeet.cx/ffmpeg/" > ffmpeg_mac/dist/ffmpeg_LICENSE.txt
          chmod +x ffmpeg_mac/dist/*
          cd ffmpeg_mac/dist
          zip -r ../../dist/ffmpeg-macos.zip ./*
          cd ../..
          sha256sum dist/ffmpeg-macos.zip > dist/ffmpeg-macos.zip.sha256

      - name: Package Linux FFmpeg (Official Prebuilt Static amd64 & arm64)
        run: |
          mkdir -p ffmpeg_linux_amd64/dist ffmpeg_linux_amd64/extracted dist
          echo "Packaging Linux amd64 static FFmpeg..."
          # Try download directly from verified GitHub Release test repository first
          if curl -fsSL --retry 3 -o dist/ffmpeg-linux.zip "https://github.com/riseofjambudvipa/test/releases/download/test/ffmpeg-linux.zip"; then
            echo "Successfully retrieved ffmpeg-linux.zip from GitHub Release."
          else
            echo "Falling back to BtbN Linux 64 GPL build..."
            curl -fsSL --retry 5 --retry-connrefused -o ffmpeg_linux_amd64/ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            tar -xf ffmpeg_linux_amd64/ffmpeg.tar.xz -C ffmpeg_linux_amd64/extracted
            find ffmpeg_linux_amd64/extracted -name "ffmpeg" -type f -exec cp {} ffmpeg_linux_amd64/dist/ \;
            find ffmpeg_linux_amd64/extracted -name "ffprobe" -type f -exec cp {} ffmpeg_linux_amd64/dist/ \;
            find ffmpeg_linux_amd64/extracted -name "LICENSE*" -o -name "GPL*" -exec cp {} ffmpeg_linux_amd64/dist/ffmpeg_LICENSE.txt \;
            if [ ! -f ffmpeg_linux_amd64/dist/ffmpeg_LICENSE.txt ]; then
              echo "FFmpeg static build (GPL): https://github.com/BtbN/FFmpeg-Builds" > ffmpeg_linux_amd64/dist/ffmpeg_LICENSE.txt
            fi
            chmod +x ffmpeg_linux_amd64/dist/*
            cd ffmpeg_linux_amd64/dist
            zip -r ../../dist/ffmpeg-linux.zip ./*
            cd ../..
          fi
          sha256sum dist/ffmpeg-linux.zip > dist/ffmpeg-linux.zip.sha256

          mkdir -p ffmpeg_linux_arm64/dist ffmpeg_linux_arm64/extracted
          echo "Packaging Linux arm64 static FFmpeg..."
          if curl -fsSL --retry 3 -o dist/ffmpeg-linux-arm64.zip "https://github.com/riseofjambudvipa/test/releases/download/test/ffmpeg-linux-arm64.zip"; then
            echo "Successfully retrieved ffmpeg-linux-arm64.zip from GitHub Release."
          else
            echo "Falling back to BtbN Linux ARM64 GPL build..."
            curl -fsSL --retry 5 --retry-connrefused -o ffmpeg_linux_arm64/ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz"
            tar -xf ffmpeg_linux_arm64/ffmpeg.tar.xz -C ffmpeg_linux_arm64/extracted
            find ffmpeg_linux_arm64/extracted -name "ffmpeg" -type f -exec cp {} ffmpeg_linux_arm64/dist/ \;
            find ffmpeg_linux_arm64/extracted -name "ffprobe" -type f -exec cp {} ffmpeg_linux_arm64/dist/ \;
            find ffmpeg_linux_arm64/extracted -name "LICENSE*" -o -name "GPL*" -exec cp {} ffmpeg_linux_arm64/dist/ffmpeg_LICENSE.txt \;
            if [ ! -f ffmpeg_linux_arm64/dist/ffmpeg_LICENSE.txt ]; then
              echo "FFmpeg static build (GPL): https://github.com/BtbN/FFmpeg-Builds" > ffmpeg_linux_arm64/dist/ffmpeg_LICENSE.txt
            fi
            chmod +x ffmpeg_linux_arm64/dist/*
            cd ffmpeg_linux_arm64/dist
            zip -r ../../dist/ffmpeg-linux-arm64.zip ./*
            cd ../..
          fi
          sha256sum dist/ffmpeg-linux-arm64.zip > dist/ffmpeg-linux-arm64.zip.sha256

      - name: Upload FFmpeg Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-artifacts
          path: |
            dist/*.zip
            dist/*.sha256

  # =========================================================================
  # 9. CLEAN SOURCE CODE ARCHIVE
  # =========================================================================
  pack_source_code:
    name: Pack Source Code
    if: ${{ inputs.pack_source_code }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Archive Clean Source Code
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/CapStudio-Source-${{ inputs.tag_name }}.zip HEAD
          ls -lh dist/

      - name: Upload Source Archive
        uses: actions/upload-artifact@v4
        with:
          name: source-artifact
          path: dist/CapStudio-Source-*.zip

  # =========================================================================
  # 10. PUBLISH GITHUB RELEASE
  # =========================================================================
  release:
    name: Create GitHub Release
    needs: [build_android, build_windows, build_web, build_macos, build_linux, build_ios, whisper_windows, whisper_macos, whisper_linux, pack_ffmpeg, pack_source_code]
    if: ${{ always() && !cancelled() && inputs.create_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all generated artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Organize Release Assets
        run: |
          mkdir -p release_assets
          find all_artifacts/ -type f \( -name "*.zip" -o -name "*.sha256" -o -name "*.apk" -o -name "*.aab" -o -name "*.dmg" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.AppImage" -o -name "*.msix" -o -name "*.exe" \) -exec cp {} release_assets/ \;
          echo "=== Release assets to be published ==="
          ls -lh release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_title }}
          draft: false
          prerelease: false
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
