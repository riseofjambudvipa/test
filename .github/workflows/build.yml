name: CapStudio Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Release Tag Name (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build_android:
    name: Build Android
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/chromium-driver"
          sudo rm -rf "/usr/local/lib/node_modules"
          df -h

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Setup signing
        if: github.event_name != 'pull_request' && secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          echo "KEYSTORE_FILE=$PWD/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - run: flutter pub get

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: build/app/outputs/bundle/release/app-release.aab

  build_ios:
    name: Build iOS
    needs: analyze_and_test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Build whisper.xcframework
        run: |
          chmod +x scripts/build/build_whisper_ios.sh
          ./scripts/build/build_whisper_ios.sh

      - run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install && cd ..

      - name: Build iOS (no-codesign, produces Runner.app for CI validation)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app as tar for artifact upload
        run: |
          tar -czf ios-runner.tar.gz -C build/ios/iphoneos Runner.app

      - name: Upload iOS build
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: ios-runner.tar.gz

  build_macos:
    name: Build macOS
    needs: analyze_and_test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      # Platform-gap fix: bundle a pinned, checksum-verified FFmpeg into the
      # app bundle so macOS works out-of-the-box (no Homebrew/manual linking).
      # Hash matches binary_downloader_service.dart's _macOsFfmpeg71Sha256.
      - name: Bundle FFmpeg into macOS app
        run: |
          set -e
          curl -fsSL -o /tmp/ffmpeg-7.1.zip https://evermeet.cx/ffmpeg/ffmpeg-7.1.zip
          echo "5a1303c7babaffff3c32c141ff49c7f44bd3b3b3e7dcea992fd7d04b6558ef43  /tmp/ffmpeg-7.1.zip" | shasum -a 256 -c -
          mkdir -p /tmp/ffmpeg-mac && cd /tmp/ffmpeg-mac && unzip -q /tmp/ffmpeg-7.1.zip
          RES_DIR="$GITHUB_WORKSPACE/build/macos/Build/Products/Release/CapStudio.app/Contents/Resources"
          mkdir -p "$RES_DIR/bin"
          cp /tmp/ffmpeg-mac/ffmpeg "$RES_DIR/bin/ffmpeg"
          chmod +x "$RES_DIR/bin/ffmpeg"
          echo "Bundled FFmpeg 7.1 into CapStudio.app/Contents/Resources/bin/"

      - name: Package macOS DMG
        run: |
          hdiutil create -format UDZO -srcfolder build/macos/Build/Products/Release/CapStudio.app build/macos/Build/Products/Release/CapStudio.dmg

      - name: Upload macOS
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/CapStudio.dmg

  build_windows:
    name: Build Windows
    needs: analyze_and_test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pre-download FFmpegKit prebuilt bundle
        shell: pwsh
        run: |
          $url = "https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/8.0.0-full-gpl-windows/ffmpeg-kit-windows-x86_64-full-gpl-8.0.0.zip"
          $zipPath = "$env:TEMP\ffmpeg-kit-windows-x86_64-full-gpl-8.0.0.zip"
          $extractPath = "D:\ffmpeg-kit"
          Write-Host "Downloading FFmpegKit from $url..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Write-Host "Extracting FFmpegKit to $extractPath..."
          New-Item -ItemType Directory -Force -Path $extractPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          Write-Host "FFmpegKit prebuilt bundle ready at $extractPath."

      - run: flutter pub get

      - name: Patch ffmpeg_kit_flutter_new include bug
        shell: pwsh
        run: |
          $file = "windows\flutter\ephemeral\.plugin_symlinks\ffmpeg_kit_flutter_new\windows\ffmpeg_kit_flutter_plugin_c_api.cpp"
          if (Test-Path $file) {
            Write-Host "Patching $file..."
            (Get-Content $file) -replace 'ffmpeg_kit_flutter_new_full', 'ffmpeg_kit_flutter_new' | Set-Content $file
            Write-Host "Patch applied successfully."
          } else {
            Write-Host "Error: $file not found!"
            exit 1
          }

      - name: Build Windows
        env:
          FFMPEGKIT_LOCAL_DIR: "D:/ffmpeg-kit"
        run: flutter build windows --release

      - name: Package Windows Release
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/runner/CapStudio-Windows-x64.zip

      - name: Upload Windows
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: build/windows/x64/runner/CapStudio-Windows-x64.zip

  build_linux:
    name: Build Linux
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgl1-mesa-dev libgles2-mesa-dev libmpv-dev \
            libvlc-dev vlc-bin libasound2-dev libpulse-dev

      - run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      # Platform-gap fix: bundle a checksum-verified static FFmpeg into the
      # release bundle so Linux works out-of-the-box (no distro install).
      # The .md5 companion is fetched from the same origin, matching the
      # runtime behavior in binary_downloader_service.dart.
      - name: Bundle FFmpeg into Linux bundle
        run: |
          set -e
          curl -fsSL -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          EXPECTED=$(curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz.md5 | awk '{print $1}')
          ACTUAL=$(md5sum /tmp/ffmpeg.tar.xz | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "FFmpeg checksum mismatch: expected $EXPECTED got $ACTUAL"
            exit 1
          fi
          mkdir -p /tmp/ffmpeg-linux && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-linux
          FFMPEG_BIN=$(find /tmp/ffmpeg-linux -name ffmpeg -type f | head -1)
          BUNDLE_BIN="$GITHUB_WORKSPACE/build/linux/x64/release/bundle/bin"
          mkdir -p "$BUNDLE_BIN"
          cp "$FFMPEG_BIN" "$BUNDLE_BIN/ffmpeg"
          chmod +x "$BUNDLE_BIN/ffmpeg"
          echo "Bundled static FFmpeg into bundle/bin/"

      - name: Build Debian Package
        run: |
          chmod +x scripts/create_deb.sh
          ./scripts/create_deb.sh

      - name: Upload Linux
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: capstudio_1.0.0_amd64.deb

  build_web:
    name: Build Web
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web Build
        uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: build/web/

  release:
    name: Create GitHub Release
    needs: [build_android, build_ios, build_macos, build_windows, build_linux, build_web]
    runs-on: ubuntu-latest
    if: ${{ inputs.create_release }}
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            artifacts/android-release/app-release.aab
            artifacts/ios-release/ios-runner.tar.gz
            artifacts/macos-release/CapStudio.dmg
            artifacts/windows-release/CapStudio-Windows-x64.zip
            artifacts/linux-release/capstudio_1.0.0_amd64.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

