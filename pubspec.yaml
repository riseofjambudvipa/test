msix_config:
  display_name: CapStudio
  publisher_display_name: Local AI

  # ---------------------------------------------------------------
  # DEV/SIDELOAD BUILD (current - uses local self-signed cert)
  # ---------------------------------------------------------------
  publisher: CN=CapStudio, O=Local AI, C=IN
  identity_name: com.capstudio
  certificate_path: third_party/scripts/certificate/windows/capstudio_cert.pfx
  # FIX (Issue #10, CapStudio 1.0 audit): certificate_password was
  # previously hardcoded here in plaintext. Do NOT hardcode it back — pass
  # it at build time instead, so it never sits in a tracked file:
  #   flutter pub run msix:create --password $env:CAPSTUDIO_CERT_PASSWORD
  # (the msix package explicitly supports --password as an override for
  # this field). Use the same env var when running create_cert.ps1.
  install_certificate: false

  # ---------------------------------------------------------------
  # MICROSOFT STORE BUILD — uncomment these and comment out the
  # DEV block above when submitting to the Windows Store.
  # Replace the values below with what Partner Center gives you.
  # Then run: dart run msix:create --store
  # ---------------------------------------------------------------
  # publisher: CN=XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
  # identity_name: 12345LocalAI.CapStudio
  # store: true
  # sign_msix: false   # Partner Center re-signs it for you

  # msix_version is intentionally omitted — auto-derived from pubspec.yaml version field
  logo_path: assets/logo/logo.png
  # capabilities MUST be a comma-separated string (not a YAML list)
  capabilities: internetClient,runFullTrust
  languages: en-us
  architecture: x64
  build_windows: true
  windows_build_args: --obfuscate --split-debug-info=./debug-info/windows

dependency_overrides:
  isar_community:
    path: third_party/isar_community
