      fonts:
        - asset: assets/fonts/design/Montserrat-Variable.ttf

    - family: Anton
      fonts:
        - asset: assets/fonts/design/Anton-Regular.ttf

    - family: Bebas Neue
      fonts:
        - asset: assets/fonts/design/BebasNeue-Regular.ttf

    - family: Bangers
      fonts:
        - asset: assets/fonts/design/Bangers-Regular.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/design/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/design/Poppins-ExtraBold.ttf
          weight: 800

    - family: Outfit
      fonts:
        - asset: assets/fonts/design/Outfit-Variable.ttf

    - family: Raleway
      fonts:
        - asset: assets/fonts/design/Raleway-Variable.ttf

    - family: Orbitron
